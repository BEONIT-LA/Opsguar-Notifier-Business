# ═══════════════════════════════════════════════════════════════
# OpsGuard — Nginx Reverse Proxy
#
# MODO SIN SSL  (puerto 8080) → descomentar bloque HTTP, comentar HTTPS
# MODO CON SSL  (puerto 8443) → descomentar bloque HTTPS, comentar HTTP
#
# Para cambiar de modo:
#   1. Edita este archivo según las instrucciones abajo
#   2. docker compose restart nginx
# ═══════════════════════════════════════════════════════════════

upstream opsguard_app {
    server app:3000;
    keepalive 32;
}

# ───────────────────────────────────────────────────────────────
# MODO SIN SSL — HTTP en puerto 80
# Activo cuando el servidor NO tiene certificados SSL
# Puerto expuesto: 8080 → (docker-compose: "8080:80")
#
# Para desactivar SSL: descomenta este bloque y comenta el de abajo
# ───────────────────────────────────────────────────────────────
