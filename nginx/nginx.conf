# ═══════════════════════════════════════════════════════════════
# OpsGuard — Nginx Reverse Proxy
#
# Estado actual : HTTP en puerto 80 (funciona sin configuración)
# Para SSL      : ver bloque comentado al final, requiere certs
# ═══════════════════════════════════════════════════════════════

upstream opsguard_app {
    server app:3000;
    keepalive 32;
}

# ───────────────────────────────────────────────────────────────
# Servidor HTTP (puerto 80)
#
# MODO SIN SSL   → sirve la app directamente (comportamiento actual)
# MODO CON SSL   → descomenta "return 301..." y comenta el bloque
#                  location para redirigir todo a HTTPS
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ── Cuando tengas SSL listo, descomenta esta línea
    #    y elimina/comenta el bloque "location /" de abajo:
    # return 301 https://$host$request_uri;

    # Tamaño máximo para subida de imágenes y documentos
    client_max_body_size 50M;

    # Timeouts generosos para WebSocket y envíos largos
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass         http://opsguard_app;
        proxy_http_version 1.1;

        # Necesario para WebSocket (Socket.io)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers de contexto real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ═══════════════════════════════════════════════════════════════
# Servidor HTTPS (puerto 443) — DESCOMENTA CUANDO TENGAS SSL
#
# Pasos para activar SSL:
#   1. Coloca tus certificados en:
#        nginx/ssl/cert.pem   → certificado público
#        nginx/ssl/key.pem    → llave privada
#   2. Cambia "tu-dominio.com" por tu dominio real
#   3. Descomenta este bloque completo
#   4. En el bloque HTTP de arriba, descomenta "return 301..."
#      y comenta el bloque "location /"
#   5. Reinicia nginx:  docker compose restart nginx
