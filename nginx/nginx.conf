# ───────────────────────────────────────────────────────────────
# MODO CON SSL — HTTPS en puerto 443
# Requiere certificados en ./ssl/cert.pem y ./ssl/key.pem
# Puerto expuesto: 8443 → (docker-compose: "8443:443")
#
# REQUISITOS:
#   - Copiar certificado en:  nginx/ssl/cert.pem  (o fullchain.crt)
#   - Copiar llave privada en: nginx/ssl/key.pem
#   - En docker-compose.yml cambiar puerto a "8443:443"
#     y agregar volumen: ./ssl:/etc/nginx/ssl:ro
# ───────────────────────────────────────────────────────────────

# Redirige HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass         http://opsguard_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
