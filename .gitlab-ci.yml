# ═══════════════════════════════════════════════════════════════
# OpsGuard — GitLab CI/CD
#
# FLUJO:
#   push a cualquier rama → corre tests
#   git tag v1.0.0        → construye y sube las 3 imágenes a GHCR (ghcr.io/beonit-la)
#
# VARIABLES REQUERIDAS (GitLab → Settings → CI/CD → Variables):
#   GHCR_USER   → usuario de GitHub con acceso a la org BEONIT-LA
#   GHCR_TOKEN  → token de GitHub con scope write:packages (guardado en Gravity Ops)
# ═══════════════════════════════════════════════════════════════

stages:
  - test
  - build

variables:
  REGISTRY: ghcr.io/beonit-la
  APP_NAME: opsguar-notifier-business
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ─────────────────────────────────────────────────────────────
# TEST — corre en cada push (todas las ramas)
# ─────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:20-alpine
  cache:
    key: node-modules-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - npm ci --prefer-offline
    - npm test
  rules:
    - if: $CI_COMMIT_TAG
      when: never          # en tags no repite tests, ya pasaron en el push
    - when: always

# ─────────────────────────────────────────────────────────────
# BUILD — solo cuando se crea un tag tipo v1.0.0
# ─────────────────────────────────────────────────────────────
.build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    # Login en GHCR
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    # Habilitar builds multi-arquitectura (amd64 + arm64)
    - docker run --rm --privileged tonistiigi/binfmt --install all
    # Crear contexto para compatibilidad con dind + TLS
    - docker context create builders
    - docker buildx create --name multiarch --driver docker-container --use builders
    - docker buildx inspect --bootstrap
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/   # solo tags: v1.0.0, v1.2.3, etc.

build-app:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "${REGISTRY}/${APP_NAME}-app:${VERSION}" \
        --tag "${REGISTRY}/${APP_NAME}-app:latest" \
        --cache-from "type=registry,ref=${REGISTRY}/${APP_NAME}-app:latest" \
        --cache-to   "type=inline" \
        --push \
        .

build-db:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "${REGISTRY}/${APP_NAME}-db:${VERSION}" \
        --tag "${REGISTRY}/${APP_NAME}-db:latest" \
        --cache-from "type=registry,ref=${REGISTRY}/${APP_NAME}-db:latest" \
        --cache-to   "type=inline" \
        --push \
        ./database

build-proxy:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "${REGISTRY}/${APP_NAME}-proxy:${VERSION}" \
        --tag "${REGISTRY}/${APP_NAME}-proxy:latest" \
        --cache-from "type=registry,ref=${REGISTRY}/${APP_NAME}-proxy:latest" \
        --cache-to   "type=inline" \
        --push \
        ./nginx
