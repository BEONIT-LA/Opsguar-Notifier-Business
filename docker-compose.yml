# ═══════════════════════════════════════════════════════════════
# OpsGuard WhatsApp Notifications
#
# ANTES DE INICIAR — edita estas variables:
#   POSTGRES_PASS  → contraseña de la base de datos
#   JWT_SECRET     → cualquier texto largo y secreto
#
# Las imágenes se construyen desde este repo (app, BD con migraciones
# 001-011, nginx). Primera vez o tras cambiar código:
#   docker compose build
#
# INICIAR:   docker compose up -d
# DETENER:   docker compose down
# LOGS:      docker compose logs -f app
# ═══════════════════════════════════════════════════════════════

services:

  # Base de datos — imagen con migraciones incluidas
  postgres:
    build: ./database
    image: ghcr.io/beonit-la/opsguar-notifier-business-db:2.0.0
    container_name: opsguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opsguard
      POSTGRES_USER:     opsguard
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-opsguard2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsguard -d opsguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cola de mensajes — imagen oficial
  redis:
    image: redis:7-alpine
    container_name: opsguard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación principal — Node.js + Vue compilado
  app:
    build: .
    image: ghcr.io/beonit-la/opsguar-notifier-business-app:2.0.0
    container_name: opsguard-app
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      REDIS_URL:     redis://redis:6379
      DATABASE_URL:  postgresql://opsguard:${POSTGRES_PASS:-opsguard2024}@postgres:5432/opsguard
      POSTGRES_HOST: postgres
      POSTGRES_DB:   opsguard
      POSTGRES_USER: opsguard
      POSTGRES_PASS: ${POSTGRES_PASS:-opsguard2024}
      JWT_SECRET:    ${JWT_SECRET:-cambia_esto_por_una_clave_segura}
      JWT_EXPIRES:   8h
      # Modo humano: pausa + "escribiendo..." antes de enviar y pausa del número
      # tras enviar (ver src/services/humanPacing.js). HUMAN_MODE=false lo apaga.
      HUMAN_MODE:            ${HUMAN_MODE:-true}
      HUMAN_THINK_MIN_MS:    ${HUMAN_THINK_MIN_MS:-1500}
      HUMAN_THINK_MAX_MS:    ${HUMAN_THINK_MAX_MS:-5000}
      HUMAN_COOLDOWN_MIN_MS: ${HUMAN_COOLDOWN_MIN_MS:-4000}
      HUMAN_COOLDOWN_MAX_MS: ${HUMAN_COOLDOWN_MAX_MS:-12000}
    volumes:
      - sessions_data:/app/auth_sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Proxy — nginx con configuración incluida
  nginx:
    build: ./nginx
    image: ghcr.io/beonit-la/opsguar-notifier-business-proxy:2.0.0
    container_name: opsguard-nginx
    restart: unless-stopped
    ports:
      # SIN SSL:  descomenta "8080:80"  y comenta "8080:80" y "8443:443"
      # CON SSL:  descomenta "8080:80" y "8443:443"
      - "8080:80"
      - "8443:443"
    volumes:
      # Certificados SSL — coloca cert.pem y key.pem en ./nginx/ssl/
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Configuración nginx — se monta para no requerir rebuild de imagen
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  sessions_data:
